---

name: 'dbsql_dbt_tpch'
version: '1.0.0'
config-version: 2

profile: 'sql_endpoints'

vars:
  tpcdi_directory: /Volumes/tpcdi/tpcdi_raw_data/tpcdi_volume/
  scalefactor: 10
  benchmark: 10
  stage: stagename
  stagingcatalog: main
  stagingschema: dbtpcdi_stg
  bucketname: bucketname  # bigquery, redshift only
  storageaccountname: synapsemigrationdemoadls
  catalog: main
  prodschema: dbtpcdi_prod

model-paths: ["Databricks/models/main"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

