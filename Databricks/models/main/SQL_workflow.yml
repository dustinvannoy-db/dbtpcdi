            - task_key: ingest_customermgmt
          run_if: AT_LEAST_ONE_SUCCESS
          notebook_task:
            notebook_path: /Users/dustin.vannoy@databricks.com/databricks-tpc-di-experiment/src/single_batch/SQL/ingest_prospectincremental
            source: WORKSPACE
