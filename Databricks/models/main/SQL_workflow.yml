        - task_key: ingest_BatchDate
          depends_on:
            - task_key: run_customermgmt_YES_NO
              outcome: "false"
            - task_key: ingest_customermgmt
          run_if: AT_LEAST_ONE_SUCCESS
          notebook_task:
            notebook_path: /Users/dustin.vannoy@databricks.com/databricks-tpc-di-experiment/src/single_batch/SQL/Ingest_Incremental
            base_parameters:
              filename: BatchDate.txt
              raw_schema: batchdate DATE
              tbl: BatchDate
            source: WORKSPACE
            warehouse_id: 26f7872a9fc2e5df
          max_retries: 2
          min_retry_interval_millis: 5000
        - task_key: ingest_FinWire
          depends_on:
            - task_key: run_customermgmt_YES_NO
              outcome: "false"
            - task_key: ingest_customermgmt
          run_if: AT_LEAST_ONE_SUCCESS
          notebook_task:
            notebook_path: /Users/dustin.vannoy@databricks.com/databricks-tpc-di-experiment/src/single_batch/SQL/ingest_finwire
            source: WORKSPACE
            warehouse_id: 26f7872a9fc2e5df
          max_retries: 2
          min_retry_interval_millis: 5000
        - task_key: ingest_ProspectIncremental
          depends_on:
            - task_key: run_customermgmt_YES_NO
