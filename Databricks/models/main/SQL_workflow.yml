resources:
  jobs:
    Dustin_Vannoy_TPCDI_SF10_DBSQL:
      name: Dustin-Vannoy-TPCDI-SF10-DBSQL
      description: The ***run_customermgmt*** paramater accepts either ***YES*** or
        ***NO***.  If this XML file has already been ingested, the *dw_init*
        task does **NOT** remove it (since it is kind of a pain). Therefore, if
        you want to disable this task and just keep the existing historical
        customermgmt staging table then change to ***NO***.  It is set to
        ***YES*** by default.
      tasks:
        - task_key: dw_init
          notebook_task:
            notebook_path: /Users/dustin.vannoy@databricks.com/databricks-tpc-di-experiment/src/single_batch/SQL/dw_init
            base_parameters:
              pred_opt: "{{job.parameters.predictive_optimization}}"
            source: WORKSPACE
            warehouse_id: 26f7872a9fc2e5df
        - task_key: run_customermgmt_YES_NO
          depends_on:
            - task_key: dw_init
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.run_customermgmt}}"
            right: YES
        - task_key: ingest_customermgmt
          depends_on:
            - task_key: run_customermgmt_YES_NO
              outcome: "true"
          notebook_task:
            notebook_path: /Users/dustin.vannoy@databricks.com/databricks-tpc-di-experiment/src/single_batch/SQL/CustomerMgmtRaw
            base_parameters:
              xml_lib: xml
            source: WORKSPACE
            warehouse_id: 26f7872a9fc2e5df
        - task_key: ingest_DimDate
          depends_on:
            - task_key: run_customermgmt_YES_NO
              outcome: "false"
            - task_key: ingest_customermgmt
          run_if: AT_LEAST_ONE_SUCCESS
          notebook_task:
            notebook_path: /Users/dustin.vannoy@databricks.com/databricks-tpc-di-experiment/src/single_batch/SQL/raw_ingestion
            base_parameters:
              raw_schema: sk_dateid BIGINT, datevalue DATE, datedesc STRING, calendaryearid
                INT, calendaryeardesc STRING, calendarqtrid INT, calendarqtrdesc
                STRING, calendarmonthid INT, calendarmonthdesc STRING,
                calendarweekid INT, calendarweekdesc STRING, dayofweeknum INT,
                dayofweekdesc STRING, fiscalyearid INT, fiscalyeardesc STRING,
                fiscalqtrid INT, fiscalqtrdesc STRING, holidayflag BOOLEAN
              filename: Date.txt
              tbl: DimDate
            source: WORKSPACE
            warehouse_id: 26f7872a9fc2e5df
          max_retries: 2
          min_retry_interval_millis: 5000
        - task_key: ingest_DimTime
          depends_on:
            - task_key: run_customermgmt_YES_NO
              outcome: "false"
            - task_key: ingest_customermgmt
          run_if: AT_LEAST_ONE_SUCCESS
          notebook_task:
            notebook_path: /Users/dustin.vannoy@databricks.com/databricks-tpc-di-experiment/src/single_batch/SQL/raw_ingestion
            base_parameters:
              raw_schema: sk_timeid BIGINT, timevalue STRING, hourid INT, hourdesc STRING,
                minuteid INT, minutedesc STRING, secondid INT, seconddesc
                STRING, markethoursflag BOOLEAN, officehoursflag BOOLEAN
              filename: Time.txt
              tbl: DimTime
            source: WORKSPACE
            warehouse_id: 26f7872a9fc2e5df
          max_retries: 2
          min_retry_interval_millis: 5000
        - task_key: ingest_StatusType
          depends_on:
            - task_key: run_customermgmt_YES_NO
              outcome: "false"
            - task_key: ingest_customermgmt
          run_if: AT_LEAST_ONE_SUCCESS
          notebook_task:
            notebook_path: /Users/dustin.vannoy@databricks.com/databricks-tpc-di-experiment/src/single_batch/SQL/raw_ingestion
            base_parameters:
              raw_schema: st_id STRING, st_name STRING
              filename: StatusType.txt
              tbl: StatusType
            source: WORKSPACE
            warehouse_id: 26f7872a9fc2e5df
          max_retries: 2
          min_retry_interval_millis: 5000
        - task_key: ingest_TaxRate
          depends_on:
            - task_key: run_customermgmt_YES_NO
              outcome: "false"
            - task_key: ingest_customermgmt
          run_if: AT_LEAST_ONE_SUCCESS
          notebook_task:
            notebook_path: /Users/dustin.vannoy@databricks.com/databricks-tpc-di-experiment/src/single_batch/SQL/raw_ingestion
            base_parameters:
              raw_schema: tx_id STRING, tx_name STRING, tx_rate FLOAT
              filename: TaxRate.txt
              tbl: TaxRate
            source: WORKSPACE
            warehouse_id: 26f7872a9fc2e5df
          max_retries: 2
          min_retry_interval_millis: 5000
        - task_key: ingest_TradeType
          depends_on:
            - task_key: run_customermgmt_YES_NO
              outcome: "false"
            - task_key: ingest_customermgmt
          run_if: AT_LEAST_ONE_SUCCESS
          notebook_task:
            notebook_path: /Users/dustin.vannoy@databricks.com/databricks-tpc-di-experiment/src/single_batch/SQL/raw_ingestion
            base_parameters:
              raw_schema: tt_id STRING, tt_name STRING, tt_is_sell INT, tt_is_mrkt INT
              filename: TradeType.txt
              tbl: TradeType
            source: WORKSPACE
            warehouse_id: 26f7872a9fc2e5df
          max_retries: 2
          min_retry_interval_millis: 5000
        - task_key: ingest_industry
