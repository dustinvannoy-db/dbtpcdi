        - name: tpcdi_directory
          default: /Volumes/tpcdi/tpcdi_raw_data/tpcdi_volume/
        - name: wh_db
          default: Dustin_Vannoy_TPCDI_DBSQL
        - name: predictive_optimization
          default: DISABLE
